name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node for npm auth
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      # Pinned to the 11.x line (not "latest") since npm 12 requires
      # a newer Node than this workflow uses.
      - name: Update npm
        run: npm install -g npm@^11

      # Setup Bun for building
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: |
          bun run lint
          bun run test

      - name: Build package
        run: bun run build

      # Temporary diagnostics for trusted publishing setup.
      # Remove once a publish succeeds.
      - name: Debug OIDC environment
        run: |
          echo "npm version: $(npm --version)"
          echo "GITHUB_ACTIONS: $GITHUB_ACTIONS"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "repo: $GITHUB_REPOSITORY"
          echo "workflow: $GITHUB_WORKFLOW_REF"

      # No NODE_AUTH_TOKEN needed: npm exchanges the GitHub OIDC
      # token (id-token: write, above) for a short-lived publish
      # token once trusted publishing is configured on npmjs.com.
      - name: Publish
        run: npm publish --access public
